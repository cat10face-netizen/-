<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SkipyyyVPN Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Плавно плывущие частицы на фоне */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(#64ffda 1px, transparent 1px),
                radial-gradient(#4facfe 1.5px, transparent 1.5px);
            background-size: 100px 100px, 150px 150px;
            background-position: 0 0, 40px 60px;
            animation: moveParticles 20s linear infinite;
            opacity: 0.3;
            z-index: 1;
        }

        @keyframes moveParticles {
            0% { background-position: 0 0, 40px 60px; }
            100% { background-position: 100px 100px, 140px 160px; }
        }

        /* Контейнер для баннера */
        .banner {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 1600px;
            padding: 40px 80px;
            background: rgba(2, 12, 27, 0.6);
            border: 2px solid rgba(100, 255, 218, 0.2);
            border-radius: 30px;
            box-shadow: 0 0 50px rgba(100, 255, 218, 0.1);
            backdrop-filter: blur(10px);
        }

        /* Левая часть с текстом */
        .text-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .title {
            font-size: 80px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px #4facfe, 0 0 40px #4facfe;
            opacity: 0;
            animation: slideUp 1s ease-out forwards;
        }

        .title span {
            color: #64ffda;
            text-shadow: 0 0 20px #64ffda, 0 0 40px #64ffda;
        }

        .subtitle {
            font-size: 110px;
            font-weight: 900;
            color: #64ffda;
            text-shadow: 0 0 30px #64ffda, 0 0 60px #64ffda;
            margin-top: 10px;
            opacity: 0;
            animation: scaleIn 1s ease-out 0.5s forwards;
        }

        .cta-text {
            font-size: 36px;
            color: #8892b0;
            margin-top: 40px;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }

        /* Правая часть с QR-кодом */
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 1.5s forwards;
        }

        .qr-container {
            width: 400px;
            height: 400px;
            background: #000;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 40px rgba(79, 172, 254, 0.4);
            animation: pulse 2s infinite ease-in-out;
            position: relative;
        }

        .qr-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .scan-text {
            font-size: 24px;
            color: #64ffda;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
            animation: pulseText 2s infinite ease-in-out;
        }

        /* Анимации */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 40px rgba(79, 172, 254, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 60px rgba(79, 172, 254, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 40px rgba(79, 172, 254, 0.4); }
        }

        @keyframes pulseText {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="particles"></div>

    <div class="banner">
        <div class="text-section">
            <div class="title">VPN ЗА <span>30 ₽</span></div>
            <div class="subtitle">НАВСЕГДА</div>
            <div class="cta-text">Безлимит. Без подписок.</div>
        </div>

        <div class="qr-section">
            <div class="qr-container">
                <!-- Здесь подключается твоя картинка с QR-кодом -->
                <img src="qr.png" alt="QR Code">
            </div>
            <div class="scan-text">Наведи камеру телефона</div>
        </div>
    </div>

</body>
</html>
